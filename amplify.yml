# Build de Amplify Hosting (rev 2026-10-16) — optimizado para desplegar rápido.
# - backend: solo corre cuando cambia amplify/ (variable AMPLIFY_DIFF_BACKEND=true
#   en la app). La config del frontend (aws-exports) la escribe
#   scripts/write-amplify-config.js desde la variable AMPLIFY_CONFIG_JSON.
# - cache: se guarda el caché de npm (~/.npm), no node_modules — `npm ci` lo
#   borra siempre, así que cachearlo no servía de nada.
version: 1
backend:
  phases:
    build:
      commands:
        - amplifyPush --simple
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        # Config del frontend desde AMPLIFY_CONFIG_JSON (sin amplifyPush).
        - node scripts/write-amplify-config.js
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
